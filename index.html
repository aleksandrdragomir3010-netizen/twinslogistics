function field(label,id,value='',type='text',full=false,placeholder=''){return `<label class="field ${full?'full':''}">${esc(label)}<input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`}
function selectField(label,id,value,opts,full=false){return `<label class="field ${full?'full':''}">${esc(label)}<select id="${id}">${opts.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}

function searchBox(){return `<div class="search"><input id="listSearch" placeholder="${esc(t('search'))}"></div>`}

function driverForm(d={}){return `<div class="settings-section"><h3>${d.id?t('editDriver'):t('addDriver')}</h3><div class="formgrid">${field(t('name'),'f_name',d.name||'')}${field(t('phone'),'f_phone',d.phone||'','tel')}${field(t('workPhone'),'f_work',d.workPhone||'')}${field(t('vehicle'),'f_vehicle',d.vehicle||'')}${field(t('startDate'),'f_date',d.date||'','date')}${selectField(t('status'),'f_status',d.status||'Работает',['Работает','В отпуске','Уволен'])}${area(t('note'),'f_note',d.note||'')}</div><div class="actions">${btn(t('save'),'formSave')}${btn(t('cancel'),'formCancel','secondary')}</div></div>`}
function genericForm(p,x={}){let fields='';if(p==='inspection')fields=field(t('model'),'f_model',x.model||'')+field(t('plate'),'f_plate',x.plate||'')+field(t('inspectionDate'),'f_date',x.date||'','date')+field(t('nextInspection'),'f_next',x.next||'','date')+field(t('station'),'f_station',x.station||'')+area(t('note'),'f_note',x.note||'');if(p==='repairs')fields=field(t('model'),'f_model',x.model||'')+field(t('plate'),'f_plate',x.plate||'')+field(t('repairEntry'),'f_date',x.date||'','date')+field(t('estimatedExit'),'f_exit',x.exit||'','date')+field(t('reasonRepair'),'f_reason',x.reason||'','text',true)+field(t('cost'),'f_cost',x.cost||'','number')+selectField(t('status'),'f_status',x.status||'Открыт',['Открыт','В работе','Завершён'])+area(t('note'),'f_note',x.note||'');if(p==='accidents')fields=field(t('model'),'f_model',x.model||'')+field(t('plate'),'f_plate',x.plate||'')+field(t('incidentDate'),'f_date',x.date||'','date')+field(t('location'),'f_location',x.location||'')+field(t('claim'),'f_claim',x.claim||'','text',true)+selectField(t('status'),'f_status',x.status||'Открыто',['Открыто','Страховая','Закрыто'])+`<label class="field full">${t('accidentPhotos')}<input id="f_accidentPhotos" type="file" accept="image/*" capture="environment" multiple><small>${lang==='en'?'You can select multiple photos or take them with your phone camera.':lang==='de'?'Mehrere Fotos auswählen oder mit der Handykamera aufnehmen.':lang==='tr'?'Birden fazla fotoğraf seçin veya telefon kamerasıyla çekin.':'Можно выбрать несколько фотографий или сделать их камерой телефона.'}</small></label><div class="field full" id="accidentPhotoPreview">${(x.photos||[]).map(p=>esc(p.name)).join(' · ')}</div>`;if(p==='docs')fields=field(t('model'),'f_model',x.model||'')+field(t('plate'),'f_plate',x.plate||'')+selectField(t('docType'),'f_type',x.type||'Техпаспорт',['Техпаспорт','Страховка','TÜV','Договор аренды','Другое'])+field(t('date'),'f_date',x.date||'','date')+`<label class="field full">${t('file')}<input id="f_docupload" type="file" accept="image/*,application/pdf" capture="environment"><small>На телефоне можно сфотографировать документ камерой или выбрать PDF.</small></label><div class="field full" id="docPreview">${x.fileName?esc(x.fileName):''}</div>`+area(t('description'),'f_note',x.note||'');if(p==='gear'){const gearOptions=['Зимняя куртка','Футболка','Штаны','Ботинки','Рабочий телефон'];const selected=Array.isArray(x.items)?x.items:(x.item?[x.item]:[]);fields=field(t('employee'),'f_employee',x.employee||'')+`<fieldset class="field full" style="border:1px solid var(--line);border-radius:10px;padding:12px"><legend>${t('item')} — можно выбрать несколько</legend><div class="gear-options">${gearOptions.map((item,i)=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 0"><input type="checkbox" name="gearItem" value="${item}" ${selected.includes(item)?'checked':''}>${t('gearItem'+i)||item}</label>`).join('')}</div></fieldset>`+field(t('quantity'),'f_qty',x.qty||'1','number')+field(t('issueDate'),'f_date',x.date||'','date')+selectField(t('condition'),'f_status',x.status||'Выдано',['Не выдано','Выдано','Возвращено'])+area(t('note'),'f_note',x.note||'')} ;return `<div class="settings-section"><h3>${x.id?t('editRecord'):t('addRecord')}</h3><div class="formgrid">${fields}</div><div class="actions">${btn(t('save'),'formSave')}${btn(t('cancel'),'formCancel','secondary')}</div></div>`}
function renderHome(){let v=list('transport'),d=list('drivers'),ins=list('inspection'),due=ins.filter(x=>x.next&&((new Date(x.next)-new Date())/86400000)<=30&&((new Date(x.next)-new Date())/86400000)>=0).length,active=v.filter(x=>x.status==='В эксплуатации').length,repair=v.filter(x=>x.status==='На ремонте').length,acc=list('accidents').length,reserve=v.filter(x=>x.status==='Резерв').length;let pct=Math.round(active*100/Math.max(v.length,1)),repairPct=Math.round(repair*100/Math.max(v.length,1));return `<div class="metrics"><div class="metric"><span class="ico">🚚</span><div><div class="num">${v.length}</div><div class="label">${t('allVehicles')}</div></div></div><div class="metric"><span class="ico">🟢</span><div><div class="num">${active}</div><div class="label">${t('inUse')}</div></div></div><div class="metric"><span class="ico">🔧</span><div><div class="num">${repair}</div><div class="label">${t('inRepair')}</div></div></div><div class="metric"><span class="ico">🚨</span><div><div class="num">${acc}</div><div class="label">${t('accidents')}</div></div></div><div class="metric"><span class="ico">🗓️</span><div><div class="num">${due}</div><div class="label">${t('upcoming')}</div></div></div></div><div class="grid"><section class="panel"><h2>${t('fleet')}</h2>${v.length?`<div class="tablewrap"><table><thead><tr><th>${t('model')}</th><th>${t('plate')}</th><th>${t('type')}</th><th>${t('status')}</th></tr></thead><tbody>${v.slice(0,8).map(x=>`<tr><td>${esc(x.model)}</td><td>${esc(x.plate)}</td><td>${esc(x.type)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('emptyVehicles')}</div>`}<div class="actions">${btn(t('transport'),'goTransport')}</div></section><section class="panel"><h2>${t('quick')}</h2><div class="quick">${btn('＋ '+t('addVehicle'),'quickVehicle')}${btn('＋ '+t('addDriver'),'quickDriver')}${btn('🚘 '+t('replace'),'quickRental')}${btn('🗓️ '+t('inspection'),'quickInspection')}</div></section></div><div class="grid" style="margin-top:14px"><section class="panel"><h2>${t('status')}</h2><div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap"><div style="width:170px;height:170px;border-radius:50%;background:conic-gradient(#25cf74 0 ${pct}%,#f5bd37 ${pct}% ${Math.min(100,pct+repairPct)}%,#1688ef ${Math.min(100,pct+repairPct)}% 100%);display:grid;place-items:center"><div style="width:100px;height:100px;border-radius:50%;background:#07182c;display:grid;place-items:center;text-align:center"><b>${v.length}</b><small>${t('allVehicles')}</small></div></div><div><p>🟢 ${t('inUse')}: ${active}</p><p>🟡 ${t('inRepair')}: ${repair}</p><p>🔵 ${t('reserve')}: ${reserve}</p></div></div></section><section class="panel"><h2>${t('upcoming')}</h2>${due?`<p>${t('inspectionAlert')}: ${due}</p>`:`<p class="note">${t('noInspection')}</p>`}<p class="note">${t('allDrivers')}: ${d.length}</p></section></div>`}

function renderDrivers(){let a=list('drivers');return `<h2>${t('driverList')}</h2><p class="note">${t('noDataSync')}</p>${searchBox()}<div class="actions">${btn('＋ '+t('addDriver'),'addNew')}</div><div id="formSlot"></div><div id="tableSlot">${tableRows('drivers',a,[t('name'),t('phone'),t('vehicle'),t('status')],x=>`<td>${esc(x.name)}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.vehicle||'—')}</td><td>${esc(x.status||'Работает')}</td>`)}</div>`}
function renderRental(){let a=list('rental');return `<h2>${t('replace')}</h2><p class="note">${t('rentalNote')}</p><div id="formSlot"></div><div class="settings-section"><div class="formgrid">${field(t('oldModel'),'r_old')}${field(t('oldPlate'),'r_oldplate')}${field(t('newModel'),'r_new')}${field(t('newPlate'),'r_newplate')}${field(t('date'),'r_date',new Date().toISOString().slice(0,10),'date')}${field(t('reason'),'r_reason','')}${field(t('driver'),'r_driver','')}${field(t('mileage'),'r_mileage','','number')}${field(t('rentalCompany'),'r_company','')}${field(t('contract'),'r_contract','')}</div><div class="actions">${btn(t('saveReplacement'),'saveRental')}</div></div><h2>${t('history')}</h2><div class="cardlist">${a.length?a.slice().reverse().map(x=>`<div class="itemcard"><div class="itemhead"><b>${esc(x.old||'—')} (${esc(x.oldplate||'—')}) → ${esc(x.new||'—')} (${esc(x.newplate||'—')})</b><button class="danger" data-delete="${esc(x.id)}">${t('delete')}</button></div><small>${esc(x.date||'')} · ${esc(x.reason||'')}</small><p>${esc(x.driver||'')} ${x.mileage?'· '+esc(x.mileage)+' km':''} ${esc(x.company||'')}</p></div>`).join(''):`<div class="empty">${t('noHistory')}</div>`}</div>`}

function getFormValues(p){const g=id=>$(id)?.value?.trim()||'';if(p==='transport')return {model:g('f_model'),plate:g('f_plate'),type:g('f_type'),status:g('f_status'),driver:g('f_driver'),year:g('f_year'),note:g('f_note')};if(p==='drivers')return {name:g('f_name'),phone:g('f_phone'),workPhone:g('f_work'),vehicle:g('f_vehicle'),date:g('f_date'),status:g('f_status'),note:g('f_note')};let x={};if(p==='inspection')Object.assign(x,{model:g('f_model'),plate:g('f_plate'),date:g('f_date'),next:g('f_next'),station:g('f_station'),note:g('f_note')});if(p==='repairs')Object.assign(x,{model:g('f_model'),plate:g('f_plate'),date:g('f_date'),exit:g('f_exit'),reason:g('f_reason'),cost:g('f_cost'),status:g('f_status'),note:g('f_note')});if(p==='accidents')Object.assign(x,{model:g('f_model'),plate:g('f_plate'),date:g('f_date'),location:g('f_location'),claim:g('f_claim'),status:g('f_status')});if(p==='docs')Object.assign(x,{model:g('f_model'),plate:g('f_plate'),type:g('f_type'),date:g('f_date'),fileName:g('f_docupload')?$('f_docupload').files[0]?.name||'':(editId?list('docs').find(z=>z.id===editId)?.fileName||'':''),note:g('f_note')});if(p==='gear')Object.assign(x,{employee:g('f_employee'),items:[...document.querySelectorAll('input[name="gearItem"]:checked')].map(el=>el.value),item:[...document.querySelectorAll('input[name="gearItem"]:checked')].map(el=>el.value).join(', '),qty:g('f_qty'),date:g('f_date'),status:g('f_status'),note:g('f_note')});return x}

function readFileData(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);const r=new FileReader();r.onload=()=>resolve({name:file.name,data:r.result,type:file.type});r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
function bindForm(p){$('formCancel').onclick=()=>{$('formSlot').innerHTML='';editId=null};if(p==='accidents')$('f_accidentPhotos')?.addEventListener('change',e=>{const out=$('accidentPhotoPreview');if(!out)return;out.innerHTML='';[...(e.target.files||[])].forEach(f=>{const img=document.createElement('img');img.src=URL.createObjectURL(f);img.alt=f.name;img.style.cssText='max-width:130px;max-height:100px;border-radius:8px;margin:5px';out.appendChild(img)})});if(p==='docs')$('f_docupload')?.addEventListener('change',e=>{const f=e.target.files?.[0],out=$('docPreview');if(!out)return;out.innerHTML='';if(!f)return;const label=document.createElement('span');label.className='tag';label.textContent='📎 '+f.name;out.appendChild(label);if(f.type.startsWith('image/')){const img=document.createElement('img');img.src=URL.createObjectURL(f);img.style.cssText='display:block;max-width:180px;max-height:140px;border-radius:8px;margin-top:8px';out.appendChild(img)}});$('formSave').onclick=async()=>{let x=getFormValues(p);if(p==='transport'&&(!x.model||!x.plate)){toast(t('requiredModel'));return}if(p==='drivers'&&!x.name){toast(t('requiredName'));return}x.id=editId||p[0]+Date.now();let a=list(p);const old=editId?a.find(z=>z.id===editId):{};if(p==='transport'){try{const photo=await readFileData($('f_photo')?.files?.[0]);const passport=await readFileData($('f_passport')?.files?.[0]);x.photo=photo?.data||old?.photo||'';x.photoName=photo?.name||old?.photoName||'';x.passport=passport?.data||old?.passport||'';x.passportName=passport?.name||old?.passportName||'';}catch(e){toast('Не удалось прочитать файл');return}}if(p==='docs'){try{const uploaded=await readFileData($('f_docupload')?.files?.[0]);x.fileData=uploaded?.data||old?.fileData||'';x.fileName=uploaded?.name||old?.fileName||'';}catch(e){toast('Не удалось прочитать документ');return}}if(p==='accidents'){try{const files=[...($('f_accidentPhotos')?.files||[])];const uploaded=[];for(const f of files)uploaded.push(await readFileData(f));x.photos=uploaded.length?uploaded:(old?.photos||[])}catch(e){toast('Не удалось прочитать фотографии');return}}if(p==='gear'&&!x.items.length){toast(lang==='en'?'Select at least one item.':lang==='tr'?'En az bir ürün seçin.':lang==='de'?'Bitte mindestens einen Artikel auswählen.':'Выбери хотя бы один предмет одежды или телефон.');return}if(editId)a=a.map(z=>z.id===editId?x:z);else a.push(x);try{saveList(p,a)}catch(e){toast('Не удалось сохранить: файл слишком большой. Выбери фото меньшего размера.');return}editId=null;render();toast(t('savedToast'))}}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;editId=null;render()});if(current==='transport'||current==='drivers'||['inspection','repairs','accidents','docs','gear'].includes(current))bindCrud(current);if(current==='rental'){$('saveRental').onclick=()=>{let g=id=>$(id).value.trim();let x={id:'r'+Date.now(),old:g('r_old'),oldplate:g('r_oldplate'),new:g('r_new'),newplate:g('r_newplate'),date:g('r_date'),reason:g('r_reason'),driver:g('r_driver'),mileage:g('r_mileage'),company:g('r_company'),contract:g('r_contract')};if(!x.old&&!x.new){toast(t('requiredModel'));return}let a=list('rental');a.push(x);saveList('rental',a);render();toast(t('savedToast'))};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm(t('confirmDelete'))){saveList('rental',list('rental').filter(x=>x.id!==b.dataset.delete));render();toast(t('deletedToast'))}})}if(current==='settings'){$('saveSettings').onclick=()=>{localStorage.setItem('tvin_interface',JSON.stringify({brand:$('s_brand').value.trim()||'Twinslogistics',accent:$('s_accent').value,theme:$('s_theme').value,density:$('s_density').value}));applyInterface();toast(t('saved'))};$('resetSettings').onclick=()=>{localStorage.removeItem('tvin_interface');render();toast(t('reset'))}}if(current==='home'){$('goTransport')?.addEventListener('click',()=>{current='transport';render()});$('quickVehicle')?.addEventListener('click',()=>{current='transport';render();$('addNew').click()});$('quickDriver')?.addEventListener('click',()=>{current='drivers';render();$('addNew').click()});$('quickRental')?.addEventListener('click',()=>{current='rental';render()});$('quickInspection')?.addEventListener('click',()=>{current='inspection';render();$('addNew').click()})}}
function applyInterface(){let c={};try{c=JSON.parse(localStorage.getItem('tvin_interface')||'{}')}catch{}$('app').classList.toggle('light-mode',c.theme==='light');$('app').classList.toggle('compact',c.density==='compact');document.documentElement.style.setProperty('--blue',c.accent||'#0878e8');const brand=$('brand');brand.textContent='🚚 '+(c.brand||'Twinslogistics');$('foot').innerHTML=esc(c.brand||'Twinslogistics')+'<br><small>'+esc(t('home'))+'</small>'}
$('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('tvin_lang',lang);render()});
// Initialize seeded fleet once, preserving existing user records.
list('transport');render();
})();
</script></body></html>
